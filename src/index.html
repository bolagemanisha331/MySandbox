<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Dev Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Local Dev Shop</h1>
        <div class="cart-icon">🛒 Cart (<span id="cart-count">0</span>)</div>
    </header>

    <main>
        <section class="products" id="product-grid"></section>
        <aside class="cart-sidebar">
            <h2>Your Cart</h2>
            <ul id="cart-items"></ul>
            <div class="cart-total">Total: $<span id="cart-total-price">0.00</span></div>
            <button id="checkout-btn" onclick="alert('Checkout demo successful!')">Proceed to Checkout</button>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
