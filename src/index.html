<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Dev Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Quick styling additions for the Checkout Modal overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white; padding: 2rem; border-radius: 8px;
            width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .form-group input { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .modal-actions button { flex: 1; padding: 0.75rem; border: none; border-radius: 4px; cursor: pointer; }
        .cancel-btn { background-color: #6c757d; color: white; }
        .submit-btn { background-color: #28a745; color: white; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .quantity-btn { padding: 2px 8px; margin: 0 5px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>Local Dev Shop</h1>
        <div class="cart-icon"> Cart (<span id="cart-count">0</span>)</div>
    </header>

    <main>
        <section class="products" id="product-grid"></section>
        <aside class="cart-sidebar">
            <h2>Your Cart</h2>
            <ul id="cart-items"></ul>
            <div class="cart-total">Total: $<span id="cart-total-price">0.00</span></div>
            <button id="checkout-btn" onclick="openCheckout()" disabled style="background-color: #6c757d;">Proceed to Checkout</button>
        </aside>
    </main>

    <!-- Checkout Modal Window -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <h2> Complete Your Order</h2>
            <div style="margin-bottom: 1rem; border-bottom: 1px solid #eee; padding-bottom: 0.5rem;">
                <strong>Order Total:</strong> $<span id="modal-total-price">0.00</span>
            </div>
            <form id="order-form" onsubmit="placeOrder(event)">
                <div class="form-group">
                    <label for="customer-name">Full Name</label>
                    <input type="text" id="customer-name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="customer-email">Email Address</label>
                    <input type="email" id="customer-email" required placeholder="john@example.com">
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeCheckout()">Cancel</button>
                    <button type="submit" class="submit-btn">Place Order </button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
